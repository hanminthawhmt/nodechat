<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NodeChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-screen">
      <div class="auth-glow"></div>
      <div class="auth-card">
        <div class="auth-logo">
          <span class="logo-mark">N</span>
          <span class="logo-text">NodeChat</span>
        </div>
        <div class="auth-tabs">
          <button
            class="auth-tab active"
            data-tab="login"
            onclick="switchAuthTab('login')"
          >
            Sign in
          </button>
          <button
            class="auth-tab"
            data-tab="register"
            onclick="switchAuthTab('register')"
          >
            Register
          </button>
        </div>
        <div id="auth-form">
          <div id="name-field" class="form-field hidden">
            <label>Name</label>
            <input
              type="text"
              id="input-name"
              placeholder="Your name"
              autocomplete="name"
            />
          </div>
          <div class="form-field">
            <label>Email</label>
            <input
              type="email"
              id="input-email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <div class="form-field">
            <label>Password</label>
            <input
              type="password"
              id="input-password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <div id="auth-error" class="form-error hidden"></div>
          <button class="btn-auth" id="auth-submit-btn" onclick="handleAuth()">
            Sign in
          </button>

          <div class="auth-divider">or</div>

          <button
            type="button"
            class="google-auth-btn"
            onclick="startGoogleAuth()"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M21.805 10.023h-9.765v3.977h5.617c-.246 1.563-1.139 2.889-2.427 3.777l3.924 3.047c2.29-2.113 3.651-5.23 3.651-8.801z"
              />
              <path
                fill="#34A853"
                d="M12.04 21.5c3.29 0 6.05-1.088 8.067-2.965l-3.924-3.047c-1.09.732-2.48 1.161-4.143 1.161-3.184 0-5.883-2.15-6.85-5.045H1.53v3.17A11.5 11.5 0 0 0 12.04 21.5z"
              />
              <path
                fill="#FBBC05"
                d="M5.19 13.6a6.92 6.92 0 0 1-.36-2.1c0-.73.13-1.44.36-2.1V6.23H1.53a11.5 11.5 0 0 0 0 10.28l3.66-3.91z"
              />
              <path
                fill="#EA4335"
                d="M12.04 5.4c1.79 0 3.4.615 4.66 1.82l3.49-3.49C18.09 1.61 15.33.5 12.04.5A11.5 11.5 0 0 0 1.53 6.23l3.66 3.17c.967-2.895 3.666-5.045 6.85-5.045z"
              />
            </svg>
            Continue with Google
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="app hidden">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <span class="logo-mark sm">N</span>
            <span class="logo-text">NodeChat</span>
          </div>
          <div class="conn-indicator" id="conn-indicator">
            <span class="conn-dot"></span>
            <span id="conn-label">connecting</span>
          </div>
        </div>

        <div class="sidebar-user">
          <div class="avatar" id="sidebar-avatar">?</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">-</div>
            <div class="sidebar-user-email" id="sidebar-email">-</div>
          </div>
          <button class="icon-btn" title="Logout" onclick="logout()">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>

        <!-- DM Search -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Direct Messages</span>
            <button class="icon-btn" title="Find user" onclick="openDMSearch()">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </button>
          </div>
          <div id="dm-list" class="channel-list"></div>
        </div>

        <!-- Rooms -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Rooms</span>
            <button
              class="icon-btn"
              title="Create room"
              onclick="openCreateRoom()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
          </div>
          <div id="room-list" class="channel-list"></div>
          <button class="browse-btn" onclick="openBrowseRooms()">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path
                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
              />
            </svg>
            Browse public rooms
          </button>
        </div>
      </aside>

      <!-- CHAT AREA -->
      <main class="chat-area">
        <!-- Empty state -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              />
            </svg>
          </div>
          <h2>Welcome to NodeChat</h2>
          <p>Select a room or start a direct message</p>
        </div>

        <!-- Chat view -->
        <div id="chat-view" class="chat-view hidden">
          <div class="chat-header">
            <div class="chat-header-info">
              <div class="chat-header-avatar" id="chat-header-avatar">#</div>
              <div>
                <div class="chat-header-name" id="chat-header-name">-</div>
                <div class="chat-header-sub" id="chat-header-sub">-</div>
              </div>
            </div>
            <div class="chat-header-actions">
              <button
                class="icon-btn"
                id="invite-btn"
                title="Invite user"
                onclick="openInviteModal()"
                style="display: none"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <line x1="19" y1="8" x2="19" y2="14" />
                  <line x1="22" y1="11" x2="16" y2="11" />
                </svg>
              </button>
            </div>
          </div>

          <div class="messages-area" id="messages-area"></div>

          <div class="input-area">
            <input
              type="text"
              id="msg-input"
              class="msg-input"
              placeholder="Message..."
              onkeydown="
                if (event.key === 'Enter' && !event.shiftKey) {
                  event.preventDefault();
                  sendMessage();
                }
              "
            />
            <button class="send-btn" onclick="sendMessage()">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- MODALS -->

    <!-- Browse Rooms Modal -->
    <div
      id="modal-browse"
      class="modal-overlay hidden"
      onclick="closeModal('modal-browse')"
    >
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Public Rooms</h3>
          <button class="icon-btn" onclick="closeModal('modal-browse')">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div id="browse-rooms-list" class="modal-list"></div>
      </div>
    </div>

    <!-- Create Room Modal -->
    <div
      id="modal-create-room"
      class="modal-overlay hidden"
      onclick="closeModal('modal-create-room')"
    >
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Create Room</h3>
          <button class="icon-btn" onclick="closeModal('modal-create-room')">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-field">
            <label>Room name</label>
            <input
              type="text"
              id="create-room-name"
              placeholder="e.g. design-team"
            />
          </div>
          <div class="form-field">
            <label>Type</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="room-type" value="public" checked />
                Public
              </label>
              <label class="radio-label">
                <input type="radio" name="room-type" value="private" /> Private
              </label>
            </div>
          </div>
          <div id="create-room-error" class="form-error hidden"></div>
          <button class="btn-primary" onclick="createRoom()">
            Create Room
          </button>
        </div>
      </div>
    </div>

    <!-- DM Search Modal -->
    <div
      id="modal-dm-search"
      class="modal-overlay hidden"
      onclick="closeModal('modal-dm-search')"
    >
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Find User</h3>
          <button class="icon-btn" onclick="closeModal('modal-dm-search')">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-field">
            <label>Search by email</label>
            <div class="input-row">
              <input
                type="email"
                id="dm-search-email"
                placeholder="user@example.com"
                onkeydown="if (event.key === 'Enter') searchUser();"
              />
              <button class="btn-sm" onclick="searchUser()">Search</button>
            </div>
          </div>
          <div id="dm-search-result" class="search-result hidden"></div>
          <div id="dm-search-error" class="form-error hidden"></div>
        </div>
      </div>
    </div>

    <!-- Invite to Room Modal -->
    <div
      id="modal-invite"
      class="modal-overlay hidden"
      onclick="closeModal('modal-invite')"
    >
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Invite to Room</h3>
          <button class="icon-btn" onclick="closeModal('modal-invite')">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-field">
            <label>Find user by email</label>
            <div class="input-row">
              <input
                type="email"
                id="invite-search-email"
                placeholder="user@example.com"
                onkeydown="if (event.key === 'Enter') searchUserForInvite();"
              />
              <button class="btn-sm" onclick="searchUserForInvite()">
                Search
              </button>
            </div>
          </div>
          <div id="invite-search-result" class="search-result hidden"></div>
          <div id="invite-error" class="form-error hidden"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="client.js"></script>
  </body>
</html>
